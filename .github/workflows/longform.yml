name: Weekly Compilation

on:
  schedule:
    - cron: '0 15 * * 3'
    - cron: '0 15 * * 6'
  workflow_dispatch:
    inputs:
      theme:
        description: 'Tema (economy/society/energy/tech/power)'
        default: 'economy'

concurrency:
  group: eyc-publish
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Sistem bagimliliklari
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Python bagimliliklari
        run: pip install -r requirements.txt

      - name: Veri onbellegi
        uses: actions/cache@v4
        with:
          path: cache
          key: eyc-data-${{ github.run_id }}
          restore-keys: eyc-data-

      - name: Derleme
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 main.py long --theme "${{ github.event.inputs.theme || 'economy' }}"

      - name: Durumu isle
        run: |
          git config user.name  "eyc-bot"
          git config user.email "bot@everyyearcounts.local"
          git add state.json
          git diff --staged --quiet || git commit -m "state: compilation $(date -u +%F)"
          git push
