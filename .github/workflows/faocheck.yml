name: FAO Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: OWID grapher slug'larini dene
        run: |
          python3 - <<'PYEOF'
          import csv, io, urllib.request

          BASE = "https://ourworldindata.org/grapher/{}.csv?v=1&csvType=full&useColumnShortNames=false"

          CANDIDATES = {
            "coffee":  ["coffee-bean-production"],
            "cocoa":   ["cocoa-beans-production", "cocoa-bean-production"],
            "tea":     ["tea-production"],
            "wine":    ["wine-production"],
            "rice":    ["rice-production"],
            "wheat":   ["wheat-production"],
            "banana":  ["banana-production"],
            "olive":   ["olive-production", "olives-production"],
            "honey":   ["honey-production"],
            "potato":  ["potato-production", "potatoes-production"],
            "tomato":  ["tomato-production", "tomatoes-production"],
            "grape":   ["grape-production", "grapes-production"],
            "orange":  ["orange-production", "oranges-production"],
            "apple":   ["apple-production", "apples-production"],
            "sugar":   ["sugar-cane-production", "sugarcane-production"],
            "maize":   ["maize-production"],
            "soybean": ["soybean-production", "soybeans-production"],
            "cattle":  ["cattle-livestock-count", "number-of-cattle", "live-cattle-stocks"],
            "sheep":   ["sheep-and-goat-livestock-count", "number-of-sheep", "sheep-livestock-count"],
            "chicken": ["chicken-livestock-count", "number-of-chickens", "poultry-livestock-count"],
          }

          def probe(slug):
              url = BASE.format(slug)
              req = urllib.request.Request(url, headers={"User-Agent": "EveryYearCounts/1.0"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  blob = r.read()
              text = blob.decode("utf-8", errors="replace")
              rdr = csv.DictReader(io.StringIO(text))
              cols = rdr.fieldnames or []
              rows = list(rdr)
              iso = [x for x in rows if len((x.get("Code") or "").strip()) == 3]
              yrs = sorted({int(x["Year"]) for x in iso if x.get("Year", "").strip().isdigit()})
              return cols, len(rows), len(iso), (yrs[0], yrs[-1]) if yrs else None

          found, missing = {}, []
          for key, slugs in CANDIDATES.items():
              hit = None
              for s in slugs:
                  try:
                      cols, n, niso, span = probe(s)
                      if niso > 500:
                          hit = (s, cols, n, niso, span)
                          break
                  except Exception as exc:
                      print(f"    {key:8s} {s:32s} -> {type(exc).__name__} {str(exc)[:60]}")
              if hit:
                  s, cols, n, niso, span = hit
                  val = [c for c in cols if c not in ("Entity", "Code", "Year")]
                  found[key] = (s, val[0] if val else "?")
                  print(f"OK  {key:8s} {s:32s} satir={n:6d} iso3={niso:6d} {span} deger_kolonu='{val[0] if val else '?'}'")
              else:
                  missing.append(key)
                  print(f"YOK {key:8s} adaylarin hicbiri tutmadi")

          print("\n" + "=" * 60)
          print(f"{len(found)} urun bulundu, {len(missing)} bulunamadi: {missing}")
          print("\nPYTHON SOZLUGU:")
          for k, (s, v) in found.items():
              print(f'    "{k}": ("{s}", "{v}"),')
          PYEOF
