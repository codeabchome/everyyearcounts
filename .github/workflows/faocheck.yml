name: FAO Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FAOSTAT uc noktalarini dene
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, itertools

          HOSTS = [
              ("fenix",  "https://fenixservices.fao.org/faostat/api/v1/en/data"),
              ("eski",   "https://faostatservices.fao.org/api/v1/en/data"),
          ]
          YEARS = [("year_range", "year_range=2018:2020"), ("year", "year=2018,2019,2020")]
          AREACS = [("iso3", "&area_cs=ISO3"), ("yok", "")]

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "EveryYearCounts/1.0"})
              with urllib.request.urlopen(req, timeout=45) as r:
                  return r.status, r.read()

          for (hn, base), (yn, yq), (an, aq) in itertools.product(HOSTS, YEARS, AREACS):
              url = (f"{base}/QCL?area=all&item=656&element=5510&{yq}{aq}"
                     f"&show_codes=true&show_unit=false&show_flags=false"
                     f"&null_values=false&output_type=objects")
              tag = f"{hn:6s} {yn:10s} area_cs={an:4s}"
              try:
                  st, blob = get(url)
                  try:
                      d = json.loads(blob)
                  except Exception:
                      print(f"{tag} -> HTTP {st} ama JSON degil: {blob[:120]!r}")
                      continue
                  rows = d.get("data") or []
                  if not rows:
                      print(f"{tag} -> HTTP {st}, data BOS. ust anahtarlar={list(d)[:6]}")
                      continue
                  r0 = rows[0]
                  print(f"{tag} -> HTTP {st}, {len(rows)} satir")
                  print(f"        anahtarlar: {list(r0)}")
                  print(f"        ilk satir : {json.dumps(r0, ensure_ascii=False)[:260]}")
              except Exception as exc:
                  print(f"{tag} -> HATA {type(exc).__name__}: {str(exc)[:140]}")
          PYEOF
