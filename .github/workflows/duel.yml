name: Daily Duel

on:
  schedule:
    # gunde 1 duello - Shorts yayinlarinin arasina dusuyor
    # dakika bilerek :00/:30 disinda (bkz. shorts.yml notu)
    - cron: '23 15 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Yuklemeden sadece render et (test)'
        type: boolean
        default: false

concurrency:
  group: eyc-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Sistem bagimliliklari
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libx11-6 fonts-dejavu-core

      - name: Python bagimliliklari
        run: pip install -r requirements.txt

      - name: Veri onbellegi
        uses: actions/cache@v4
        with:
          path: cache
          key: eyc-data-${{ github.run_id }}
          restore-keys: eyc-data-

      - name: Render + yukle
        env:
          EYC_PRIVACY: public
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 main.py duel ${{ inputs.dry && '--dry' || '' }}

      - name: Durumu isle
        run: |
          git config user.name  "eyc-bot"
          git config user.email "bot@everyyearcounts.local"
          git add state.json
          git diff --staged --quiet && exit 0
          git commit -m "state: $(date -u +%F_%H:%M)"
          # push reddedilirse durum kaybolmasin: rebase edip tekrar dene.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push reddedildi, rebase deneniyor ($i)"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          exit 1
