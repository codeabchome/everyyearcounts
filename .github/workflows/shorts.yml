name: Daily Shorts

on:
  schedule:
    # gunde 3 Shorts - ABD Dogu saatine gore yayilmis
    - cron: '30 12 * * *'
    - cron: '30 17 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:

concurrency:
  group: eyc-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Sistem bagimliliklari
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libx11-6 fonts-dejavu-core

      - name: Python bagimliliklari
        run: pip install -r requirements.txt

      - name: Veri onbellegi
        uses: actions/cache@v4
        with:
          path: cache
          key: eyc-data-${{ github.run_id }}
          restore-keys: eyc-data-

      - name: Render + yukle
        env:
          EYC_PRIVACY: public
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 main.py short

      - name: Durumu isle
        run: |
          git config user.name  "eyc-bot"
          git config user.email "bot@everyyearcounts.local"
          git add state.json
          git diff --staged --quiet || git commit -m "state: $(date -u +%F_%H:%M)"
          git push

      - name: Hata durumunda issue ac
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Pipeline hatasi: Daily Shorts"
          NUM=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Yine basarisiz oldu: $RUN_URL"
          else
            gh issue create --title "$TITLE" \
              --body "Bu is basarisiz oldu ve kanal yayin yapamiyor olabilir. Log: $RUN_URL"
          fi
